name: Build calendar APK

on:
    pull_request:
        branches: [main]
    push:
        branches: [feature/business-calendar-month-view]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-java@v4
              with:
                  java-version: 17
                  distribution: "temurin"

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Restore signing keystore
              if: ${{ secrets.SIGNING_STORE_B64 != '' }}
              run: |
                  mkdir -p debug-signing
                  echo "${{ secrets.SIGNING_STORE_B64 }}" | base64 --decode > debug-signing/calendar-release.p12
                  echo "storeFile=debug-signing/calendar-release.p12
                    storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}
                    keyAlias=calendar
                    keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}
                    storeType=pkcs12" > keystore.properties

            - name: Build debug APK
              run: ./gradlew assembleFossDebug

            - name: Upload debug APK
              uses: actions/upload-artifact@v4
              with:
                  name: calendar-foss-debug
                  path: app/build/outputs/apk/foss/debug/*.apk