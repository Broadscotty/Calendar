name: Build calendar APK

on:
    pull_request:
        branches: [main]
    push:
        branches: [feature/business-calendar-month-view]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-java@v4
              with:
                  java-version: 17
                  distribution: "temurin"

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Restore signing keystore
              env:
                  SIGNING_STORE_B64: ${{ secrets.SIGNING_STORE_B64 }}
                  SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
                  SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
              run: |
                  if [ -z "$SIGNING_STORE_B64" ]; then
                    echo "No signing secret present; using default debug signing."
                    exit 0
                  fi
                  mkdir -p debug-signing
                  echo "$SIGNING_STORE_B64" | base64 --decode > debug-signing/calendar-release.p12
                  printf 'storeFile=debug-signing/calendar-release.p12\nstorePassword=%s\nkeyAlias=calendar\nkeyPassword=%s\nstoreType=pkcs12\n' "$SIGNING_STORE_PASSWORD" "$SIGNING_KEY_PASSWORD" > keystore.properties

            - name: Build debug APK
              run: ./gradlew assembleFossDebug

            - name: Upload debug APK
              uses: actions/upload-artifact@v4
              with:
                  name: calendar-foss-debug
                  path: app/build/outputs/apk/foss/debug/*.apk